[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premodel"
version = "0.2.0"
description = "Premier League match forecasting benchmarked against the betting market"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ishaan" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# On-chain commit-reveal (Solana devnet). Pinned: onchain.py is checked against these APIs.
onchain = ["solana==0.40.3", "solders==0.29.0"]

[project.scripts]
premodel = "premodel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long checks, opt-in with `pytest -m slow`"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
